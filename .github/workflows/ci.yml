name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rspec: ["3.12", "3.13", "4.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          bundler: default
      - name: Select dependency matrix
        shell: bash
        run: |
          echo "BUNDLE_GEMFILE=$GITHUB_WORKSPACE/gemfiles/rspec_${{ matrix.rspec }}.gemfile" >> "$GITHUB_ENV"
      - run: bundle install
      - run: bundle exec rspec
